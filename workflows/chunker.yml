name: Build Chunk Index

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - 'run_chunker.py'
      - 'markdown_chunker.py'
      - 'chunker.config.json'
      - 'urls.map.csv'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas

      - name: Run chunker
        run: python run_chunker.py

      - name: Upload results (JSONL + CSV)
        uses: actions/upload-artifact@v4
        with:
          name: chunk-output
          path: |
            aps_chunk_index.jsonl
            aps_chunk_index.csv
