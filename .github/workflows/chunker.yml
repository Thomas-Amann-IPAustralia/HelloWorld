name: Build & Commit Chunk Index

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.md'
      - 'run_chunker.py'
      - 'markdown_chunker.py'
      - 'chunker.config.json'
      - 'urls.map.csv'
    paths-ignore:
      - 'data/chunks/**'   # avoid re-triggering from our own commits

permissions:
  contents: write  # allow this workflow to push back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # keep history so pushes are clean

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas

      - name: Run chunker
        run: python run_chunker.py

      # Option A: simple, well-maintained action for auto-commits
      - name: Commit chunk outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update chunk index"
          file_pattern: data/chunks/**
