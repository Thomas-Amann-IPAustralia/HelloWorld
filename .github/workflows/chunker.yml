name: Build & Commit Chunk Index

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'data/chunks/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas

      - name: Run chunker
        run: python run_chunker.py

      - name: Commit chunk outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update chunk index"
          file_pattern: data/chunks/**
